<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5c400"><title>حساب کاربری | GoldGame</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/style.css">
<style>.account-wrap{min-height:65vh;display:grid;place-items:center;padding:40px 18px}.account-card{width:min(100%,620px);padding:30px;border-radius:22px;border:1px solid #f5c45555;background:#111e;box-shadow:0 20px 70px #0008}.account-card h1{font-size:clamp(26px,5vw,38px)}.account-card p{line-height:2;color:#ddd}.account-card button,.account-card a.action{display:inline-block;border:0;border-radius:12px;background:#f5c400;color:#171300;padding:12px 18px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;margin:8px 0}.status{color:#f5c400;line-height:1.8}</style></head>
<body><div class="shade"></div><header class="topbar"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="GoldGame"><span>GOLD<span class="gold">GAME</span></span></a><button class="menu-btn" aria-label="باز کردن منو">☰</button><nav><a href="index.html">خانه</a><a href="shop.html">فروشگاه</a><a href="rules.html">قوانین</a><a href="launcher.html">دانلود لانچر</a><a class="active" href="account.html">حساب کاربری</a></nav><a class="nav-cta" href="shop.html">مشاهده فروشگاه <span>↗</span></a></header>
<main class="account-wrap"><section class="account-card"><span class="eyebrow"><i></i> پنل کاربری</span><h1>حساب <span class="gold">GoldGame</span></h1><p id="account-info">در حال بررسی وضعیت ورود…</p><div id="account-actions"></div><p class="status" id="account-status" role="status"></p><a class="action" href="index.html">بازگشت به خانه</a></section></main>

<script src="assets/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const info=document.getElementById('account-info'),actions=document.getElementById('account-actions'),status=document.getElementById('account-status');const url=window.GOLDGAME_SUPABASE_URL,key=window.GOLDGAME_SUPABASE_ANON_KEY;if(!url||!key||url.includes('PASTE_YOUR')||key.includes('PASTE_YOUR')){info.textContent='اتصال Supabase هنوز تنظیم نشده است. فایل assets/supabase-config.js را تکمیل کن.';return}if(!window.supabase){info.textContent='کتابخانه ورود بارگذاری نشد؛ اتصال اینترنت را بررسی کن.';return}const sb=window.supabase.createClient(url,key);const {data:{user},error}=await sb.auth.getUser();if(error||!user){info.textContent='برای دیدن پنل کاربری ابتدا وارد حساب شو.';actions.innerHTML='<a class="action" href="auth.html">ورود / ثبت‌نام</a>';return}info.textContent='خوش اومدی، '+(user.user_metadata?.display_name||user.email)+'!';const email=document.createElement('p');email.textContent='ایمیل حساب: '+user.email;info.appendChild(email);const btn=document.createElement('button');btn.textContent='خروج از حساب';btn.onclick=async()=>{btn.disabled=true;const {error}=await sb.auth.signOut();if(error){status.textContent='خروج ناموفق بود: '+error.message;btn.disabled=false}else location.href='index.html'};actions.appendChild(btn);})();
</script></body></html>
